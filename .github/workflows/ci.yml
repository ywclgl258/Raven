name: Raven Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM Tests, Lint & Debug Builds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run 17-module unit tests
        run: ./gradlew :core:model:test :core:common:test :core:site-spi:test :sites:video:test :sites:comic:test :sites:gallery:test testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble Debug APK & Compile AndroidTest Sources
        run: ./gradlew :app:assembleDebug :core:database:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestKotlin --no-daemon

  device-tests:
    name: Compose Smoke & Room Migration Tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access for the emulator
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Run instrumented tests on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          script: ./gradlew :app:connectedDebugAndroidTest :core:database:connectedDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
