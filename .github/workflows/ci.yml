name: Raven Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: raven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM Tests, Lint & Debug Builds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Run 17-module unit tests
        run: ./gradlew :core:model:test :core:common:test :core:site-spi:test testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble Debug APK & Compile AndroidTest Sources
        run: ./gradlew :app:assembleDebug :core:database:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestKotlin --no-daemon
