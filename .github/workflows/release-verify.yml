name: Raven Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raven-release-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Signed APK, Certificate & Package Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare external release signing
        env:
          RAVEN_KEYSTORE_BASE64: ${{ secrets.RAVEN_KEYSTORE_BASE64 }}
          RAVEN_KEYSTORE_PASSWORD: ${{ secrets.RAVEN_KEYSTORE_PASSWORD }}
          RAVEN_KEY_ALIAS: ${{ secrets.RAVEN_KEY_ALIAS }}
          RAVEN_KEY_PASSWORD: ${{ secrets.RAVEN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_DIR="${RUNNER_TEMP}/raven-signing"
          mkdir -p "${SIGNING_DIR}"
          chmod 700 "${SIGNING_DIR}"
          printf '%s' "${RAVEN_KEYSTORE_BASE64}" | base64 --decode > "${SIGNING_DIR}/raven-release.jks"
          umask 077
          cat > "${SIGNING_DIR}/signing.properties" <<EOF
          KEYSTORE_PATH=raven-release.jks
          KEYSTORE_PASSWORD=${RAVEN_KEYSTORE_PASSWORD}
          KEY_ALIAS=${RAVEN_KEY_ALIAS}
          KEY_PASSWORD=${RAVEN_KEY_PASSWORD}
          EOF
          chmod 600 "${SIGNING_DIR}/raven-release.jks" "${SIGNING_DIR}/signing.properties"
          echo "RAVEN_SIGNING_HOME=${SIGNING_DIR}" >> "${GITHUB_ENV}"

      - name: Validate signing & build Release APK
        run: ./gradlew :app:validateReleaseSigning :app:assembleRelease --no-daemon

      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          if [ ! -d "${BUILD_TOOLS}" ]; then
            BUILD_TOOLS="$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -1)"
          fi
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          AAPT2="${BUILD_TOOLS}/aapt2"

          verification="$("${APKSIGNER}" verify --verbose --print-certs "${APK}")"
          printf '%s\n' "${verification}"
          for scheme in v2 v3; do
            printf '%s\n' "${verification}" | grep -E "Verified using ${scheme} scheme.*: true"
          done

          # apksigner skips JAR verification by default when minSdk >= 24 and v2/v3 exist.
          v1_verification="$("${APKSIGNER}" verify --verbose --print-certs --min-sdk-version 23 --max-sdk-version 23 "${APK}")"
          printf '%s\n' "${v1_verification}" | grep -E '^(Verifies|Verified using|Number of signers:|Signer #1 certificate (DN|SHA-256 digest):)'
          printf '%s\n' "${v1_verification}" | grep -E 'Verified using v1 scheme.*: true'

          expected_cert="$(grep '^releaseCertificate=' release.properties | cut -d= -f2 | tr -d ':\r' | tr '[:lower:]' '[:upper:]')"
          actual_cert="$(printf '%s\n' "${verification}" | grep 'Signer #1 certificate SHA-256 digest:' | cut -d: -f2- | tr -d ' ' | tr '[:lower:]' '[:upper:]')"
          actual_v1_cert="$(printf '%s\n' "${v1_verification}" | grep 'Signer #1 certificate SHA-256 digest:' | cut -d: -f2- | tr -d ' ' | tr '[:lower:]' '[:upper:]')"
          test -n "${actual_cert}"
          test "${actual_cert}" = "${expected_cert}"
          test "${actual_v1_cert}" = "${expected_cert}"

          expected_name="$(grep '^versionName=' release.properties | cut -d= -f2 | tr -d '\r')"
          expected_code="$(grep '^versionCode=' release.properties | cut -d= -f2 | tr -d '\r')"
          package_line="$("${AAPT2}" dump badging "${APK}" | grep -m1 '^package:')"
          printf '%s\n' "${package_line}"
          printf '%s' "${package_line}" | grep -F "name='com.raven.app'"
          printf '%s' "${package_line}" | grep -F "versionCode='${expected_code}'"
          printf '%s' "${package_line}" | grep -F "versionName='${expected_name}'"

      - name: Clean up temporary signing files
        if: always()
        run: rm -rf "${RUNNER_TEMP}/raven-signing"
