# App website on the standard HTTPS port. The updater has its own 8443 virtual host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ywclgl258.us.ci;

    ssl_certificate /etc/letsencrypt/live/ywclgl258.us.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ywclgl258.us.ci/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/raven-site/public;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'sha256-fcgPm8V0JXofM+89bftbho8X5txhsS4Uw0w5/1BZ4TE='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        default_type text/html;
        charset utf-8;
        expires -1;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        types { image/png png; image/webp webp; }
        expires 1h;
        try_files $uri =404;
    }

    location ~ ^/download/(?<raven_apk>Raven-v[0-9]+\.[0-9]+\.[0-9]+-release\.apk)$ {
        try_files $uri =404;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$raven_apk"';
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    location / {
        return 404;
    }
}
