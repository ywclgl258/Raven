# Raven fallback update channel, included by /etc/nginx-ai/nginx.conf via sites/*.conf.
# Served on the domain with the existing publicly trusted Let's Encrypt certificate (auto-renewed
# by certbot.timer). Port 8443 is dedicated to updates; existing vhosts are untouched.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name ywclgl258.us.ci;

    ssl_certificate     /etc/letsencrypt/live/ywclgl258.us.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ywclgl258.us.ci/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RavenUpdateTLS:4m;
    ssl_session_timeout 1h;

    root /var/www/raven-update/public;
    autoindex off;
    server_tokens off;

    location = /raven/health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"raven-update"}';
    }

    location = /raven/releases/latest {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ^~ /raven/releases/assets/ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
