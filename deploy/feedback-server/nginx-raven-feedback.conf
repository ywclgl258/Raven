# Include inside the existing ywclgl258.us.ci :443 server, before "location / { return 404; }".
# The feedback process only listens on 127.0.0.1:8765.

location = /api/feedback {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location = /api/feedback/health {
    proxy_pass http://127.0.0.1:8765;
    add_header Cache-Control "no-store" always;
}

location = /api/feedback/meta {
    proxy_pass http://127.0.0.1:8765;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/admin/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

# The admin page has no inline script (admin.js is a separate file), so `script-src 'self'` is
# enough and no brittle hash has to be kept in sync with the HTML. Server-level add_header is not
# inherited by these locations, so each one repeats its own policy.
location = /admin {
    proxy_pass http://127.0.0.1:8765;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}

location = /admin/ {
    proxy_pass http://127.0.0.1:8765;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}

location = /admin/app.js {
    proxy_pass http://127.0.0.1:8765;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
