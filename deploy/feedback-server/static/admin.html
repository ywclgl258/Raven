<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Raven 反馈后台</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #09090b;
      --surface: #121216;
      --raised: #1b1b22;
      --ink: #f5f5f7;
      --muted: #9e9ea8;
      --line: #2a2a33;
      --accent: #ff4d58;
      --ok: #30d158;
      --warn: #ffd60a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.55 system-ui, "Segoe UI", sans-serif; }
    header, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; min-height: 72px; }
    h1 { font-size: 1.35rem; margin: 0; }
    h1 span { color: var(--accent); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, .linkish { border: 0; border-radius: 12px; min-height: 40px; padding: 8px 14px; background: var(--accent); color: #13090a; font-weight: 700; cursor: pointer; }
    button.ghost { background: var(--raised); color: var(--ink); border: 1px solid var(--line); }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 10px 12px; }
    textarea { min-height: 92px; resize: vertical; }
    .login, .panel, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
    .login { width: min(420px, calc(100% - 32px)); margin: 10vh auto; padding: 28px; display: grid; gap: 12px; }
    .toolbar, .stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .stats span, .pill { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding-bottom: 40px; }
    .list { display: grid; gap: 8px; align-content: start; max-height: calc(100vh - 150px); overflow: auto; }
    .card { padding: 12px 14px; text-align: left; background: var(--surface); color: inherit; }
    .card.active { border-color: var(--accent); }
    .card small, .muted { color: var(--muted); }
    .detail { padding: 18px; display: grid; gap: 12px; }
    pre { white-space: pre-wrap; background: #070709; border-radius: 12px; padding: 12px; max-height: 280px; overflow: auto; }
    .hidden { display: none; }
    .error { color: #ff8a84; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .list { max-height: 320px; } }
  </style>
</head>
<body>
  <form id="login" class="login hidden">
    <h1>Raven <span>反馈后台</span></h1>
    <p class="muted">口令只保存在这台 VPS 的环境文件里，不会写入仓库。</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="管理口令" required minlength="12">
    <button type="submit">登录</button>
    <p id="loginError" class="error"></p>
  </form>
  <div id="app" class="hidden">
    <header>
      <h1>Raven <span>反馈</span></h1>
      <div class="toolbar">
        <button class="ghost" id="exportHint" type="button">本地整理：pull-feedback.ps1</button>
        <button class="ghost" id="logout" type="button">退出</button>
      </div>
    </header>
    <main>
      <div class="stats" id="stats"></div>
      <div class="toolbar" style="margin: 14px 0;">
        <select id="status" style="max-width: 160px;">
          <option value="all">全部状态</option>
          <option value="new">新反馈</option>
          <option value="triaged">已分拣</option>
          <option value="in_progress">处理中</option>
          <option value="resolved">已解决</option>
          <option value="wontfix">不修复</option>
          <option value="duplicate">重复</option>
        </select>
        <select id="source" style="max-width: 140px;">
          <option value="all">全部来源</option>
          <option value="app">应用</option>
          <option value="website">官网</option>
        </select>
        <input id="query" placeholder="搜索编号、标题、设备" style="max-width: 280px;">
      </div>
      <div class="layout">
        <div class="list" id="list"></div>
        <section class="panel detail" id="detail"><p class="muted">选择一条反馈。</p></section>
      </div>
    </main>
  </div>
  <script src="/admin/app.js" defer></script>
</body>
</html>
