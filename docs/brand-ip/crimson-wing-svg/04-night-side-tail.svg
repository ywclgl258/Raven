<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Raven 夜航：侧马尾大笑女孩头像</title>
  <desc id="description">透明底的原创女性 Q 版头像，黑色侧马尾、绯红三羽发饰和明亮笑容。</desc>
  <style>
    #eyes-right-blink {
      transform-box: view-box;
      transform-origin: 371px 318px;
      animation: raven-wink-loop 6.1s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    #feather-clasp {
      transform-box: view-box;
      transform-origin: 327px 153px;
      animation: raven-feather 4.4s ease-in-out infinite;
    }
    #side-tail {
      transform-box: view-box;
      transform-origin: 180px 140px;
      animation: raven-tail 5.8s ease-in-out infinite;
    }
    @keyframes raven-wink-loop {
      0%, 91%, 95%, 100% { transform: scaleY(1); }
      92%, 93% { transform: scaleY(.07); }
    }
    @keyframes raven-feather {
      0%, 100% { transform: rotate(1.2deg); }
      50% { transform: rotate(-2deg); }
    }
    @keyframes raven-tail {
      0%, 100% { transform: rotate(-.8deg); }
      50% { transform: rotate(1.3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #eyes-right-blink, #feather-clasp, #side-tail { animation: none; }
    }
  </style>
