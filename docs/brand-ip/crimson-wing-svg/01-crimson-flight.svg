<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Raven 疾翼：眨眼短发女孩头像</title>
  <desc id="description">透明底的原创女性 Q 版头像，黑色短发，绯红三羽发饰，单眼眨眼。</desc>
  <style>
    #left-eye-blink {
      transform-box: view-box;
      transform-origin: 342px 326px;
      animation: raven-blink 5.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    #feather-clasp {
      transform-box: view-box;
      transform-origin: 359px 145px;
      animation: raven-feather 4.6s ease-in-out infinite;
    }
    @keyframes raven-blink {
      0%, 91%, 96%, 100% { transform: scaleY(1); }
      93%, 94% { transform: scaleY(.08); }
    }
    @keyframes raven-feather {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #left-eye-blink, #feather-clasp { animation: none; }
    }
  </style>
