<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Raven 银鸦：圆框眼镜女孩头像</title>
  <desc id="description">透明底的原创女性 Q 版头像，银色短发、圆框眼镜和绯红三羽发饰。</desc>
  <style>
    .both-eyes-blink {
      transform-box: view-box;
      transform-origin: 273px 339px;
      animation: raven-blink 6.4s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    #feather-clasp {
      transform-box: view-box;
      transform-origin: 147px 155px;
      animation: raven-feather 4.9s ease-in-out infinite;
    }
    @keyframes raven-blink {
      0%, 92%, 96%, 100% { transform: scaleY(1); }
      93.3%, 94.2% { transform: scaleY(.1); }
    }
    @keyframes raven-feather {
      0%, 100% { transform: rotate(1deg); }
      50% { transform: rotate(-1.4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .both-eyes-blink, #feather-clasp { animation: none; }
    }
  </style>
