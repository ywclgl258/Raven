<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Raven 月影：半眯眼黑发女孩头像</title>
  <desc id="description">透明底的原创女性 Q 版头像，黑色长发带银色挑染，半眯眼和绯红三羽发饰。</desc>
  <style>
    .both-eyes-blink {
      transform-box: view-box;
      transform-origin: 271px 330px;
      animation: raven-slow-blink 7.2s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    #feather-clasp {
      transform-box: view-box;
      transform-origin: 367px 143px;
      animation: raven-feather 5.1s ease-in-out infinite;
    }
    @keyframes raven-slow-blink {
      0%, 92%, 96%, 100% { transform: scaleY(1); }
      93.5%, 94.5% { transform: scaleY(.12); }
    }
    @keyframes raven-feather {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1.6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .both-eyes-blink, #feather-clasp { animation: none; }
    }
  </style>
